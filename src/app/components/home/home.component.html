<div class="container-fluid">
    <div class="row">
        <div class="col col-8">
            <div class="row text-center">
                <table class="table text-center justify-content-center">
                    <thead class="row-1">
                        <tr>
                            <th class="col" *ngFor="let header of headers">{{header}}</th>
                        </tr>
                    </thead>
                    <div class="bill_template">
                        <tbody class="row">
                            <tr *ngFor="let product of products">
                                <td class="col">{{product.productDescription}}</td>
                                <td class="col">{{product.productMrp}}</td>
                                <td class="col">{{product.productPrice}}</td>
                                <td class="col">{{1}}</td>
                            </tr>
                        </tbody>
                    </div>
                </table>
            </div>
        </div>
        <div class="col-4">
            <div class="row-4">
                <div class="row grid text-center g-0">
                    <div [ngClass]="'functional_buttons'" class="col-md-4"
                        (click)="navigateTo( COMMON_CONSTANTS.VARIABLE_CONSTANTS.ADD_PRODUCTS )">Add product</div>
                    <div [ngClass]="'functional_buttons'" class="col-md-4"
                        (click)="navigateTo( COMMON_CONSTANTS.VARIABLE_CONSTANTS.UPDATE_PRODUCTS )">Edit product</div>
                    <div [ngClass]="'functional_buttons'" class="col-md-4"
                        (click)="navigateTo( COMMON_CONSTANTS.VARIABLE_CONSTANTS.BILLING_HISTORY )">Billing History
                    </div>
                    <div [ngClass]="'functional_buttons'" class="col-md-4"
                        (click)="navigateTo( COMMON_CONSTANTS.VARIABLE_CONSTANTS.ADD_PRODUCTS )">Add product</div>
                    <div [ngClass]="'functional_buttons'" class="col-md-4"
                        (click)="navigateTo( COMMON_CONSTANTS.VARIABLE_CONSTANTS.UPDATE_PRODUCTS )">Edit product</div>
                    <div [ngClass]="'functional_buttons'" class="col-md-4"
                        (click)="navigateTo( COMMON_CONSTANTS.VARIABLE_CONSTANTS.BILLING_HISTORY )">Billing History
                    </div>
                    <div [ngClass]="'functional_buttons'" class="col-md-4"
                        (click)="navigateTo( COMMON_CONSTANTS.VARIABLE_CONSTANTS.ADD_PRODUCTS )">Add product</div>
                    <div [ngClass]="'functional_buttons'" class="col-md-4"
                        (click)="navigateTo( COMMON_CONSTANTS.VARIABLE_CONSTANTS.UPDATE_PRODUCTS )">Edit product</div>
                    <div [ngClass]="'functional_buttons'" class="col-md-4"
                        (click)="navigateTo( COMMON_CONSTANTS.VARIABLE_CONSTANTS.BILLING_HISTORY )">Billing History
                    </div>
                </div>
            </div>
            <div class="row row-8 mt-5">
                <ng-container [ngSwitch]="currentComponent">
                    <app-addproduct *ngSwitchCase=" COMMON_CONSTANTS.VARIABLE_CONSTANTS.ADD_PRODUCTS ">
                    </app-addproduct>
                    <app-updateproduct *ngSwitchCase=" COMMON_CONSTANTS.VARIABLE_CONSTANTS.UPDATE_PRODUCTS ">
                    </app-updateproduct>
                    <app-billing-history
                        *ngSwitchCase=" COMMON_CONSTANTS.VARIABLE_CONSTANTS.BILLING_HISTORY"></app-billing-history>
                </ng-container>
            </div>
        </div>
    </div>
    <div class="row grid">
        <div class="col-8">
            <input type="text" #search placeholder="Scan here" style="width:100%" (input)="onSearch($event)">
        </div>
    </div>
</div>
